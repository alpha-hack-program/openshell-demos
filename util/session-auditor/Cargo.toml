[package]
name = "session-auditor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "session-auditor"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
