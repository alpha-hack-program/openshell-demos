<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian Inc. — OpenShell audit trail</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0b0f14;
    color: #e6edf3;
    margin: 0;
  }
  #app { padding: 24px 32px; }
  .brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #d29922;
    margin-bottom: 6px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.subtitle { color: #8b949e; font-size: 13px; margin-top: 0; }
  svg { width: 100%; height: auto; display: block; }
  text { font-family: inherit; }
  .pulse-ring {
    transform-box: fill-box;
    transform-origin: center;
    animation-name: heartbeat-pulse;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
    pointer-events: none;
  }
  @keyframes heartbeat-pulse {
    0% { transform: scale(0.7); opacity: 0.85; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .legend { display: flex; gap: 20px; font-size: 12px; color: #8b949e; margin-bottom: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .layout { display: flex; gap: 24px; align-items: flex-start; }
  .main { flex: 1 1 auto; min-width: 0; }
  .events-panel {
    flex: 0 0 320px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px 16px;
    max-height: 640px;
    display: flex;
    flex-direction: column;
  }
  .events-panel h2 { font-size: 14px; margin: 0 0 2px; }
  .events-panel .subtitle { margin-bottom: 10px; }
  .event-list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .event-empty { color: #8b949e; font-size: 12px; }
  .event-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    line-height: 1.5;
    border-bottom: 1px solid #21262d;
    padding-bottom: 8px;
  }
  .event-time { color: #8b949e; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .event-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; margin-top: 4px; }
  .event-body { color: #e6edf3; word-break: break-word; }
  .tooltip {
    position: fixed;
    left: 32px;
    bottom: 24px;
    background: #161b22;
    border: 1px solid #30363d;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    max-width: 320px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="/bundle.js"></script>
</body>
</html>
