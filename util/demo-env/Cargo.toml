[package]
name = "demo-env"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "demo-env"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-parser = "0.18"
