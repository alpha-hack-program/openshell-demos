[workspace]
resolver = "2"
members = ["parrot-core", "parrot-tui", "parrot-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Pinned to the same OpenShell release this repo's demos target (see root
# .env's OPENSHELL_CHART_VERSION). Neither crate is published to crates.io
# yet, so both are consumed as git dependencies from the same tag. Bump via
# `make bump-openshell-sdk OPENSHELL_SDK_TAG=vX.Y.Z` rather than editing
# these lines by hand — the Makefile target keeps both in sync and re-runs
# `cargo update`.
[workspace.dependencies]
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.0.106" }
openshell-bootstrap = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.0.106" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
tonic = "0.14"
clap = { version = "4", features = ["derive", "env"] }
