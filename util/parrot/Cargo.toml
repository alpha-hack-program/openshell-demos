[workspace]
resolver = "2"
members = ["parrot-core", "parrot-tui", "parrot-gpui", "parrot-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"

# Pinned to the same OpenShell release this repo's demos target (see root
# .env's OPENSHELL_CHART_VERSION). Neither crate is published to crates.io
# yet, so both are consumed as git dependencies from the same tag. Bump via
# `make bump-openshell-sdk OPENSHELL_SDK_TAG=vX.Y.Z` rather than editing
# these lines by hand — the Makefile target keeps both in sync and re-runs
# `cargo update`.
[workspace.dependencies]
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.8" }
openshell-bootstrap = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.8" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
tonic = "0.14"
prost-types = "0.14"
clap = { version = "4", features = ["derive", "env"] }
tauri = { version = "2" }
# Matches the version openshell-sdk already pins transitively (see its own
# oidc.rs), so this doesn't add a second copy to the dependency graph.
oauth2 = "5"
url = "2"
# Matches the version the keycloak-oidc demo's own MCP servers
# (mcp/mcp-*/Cargo.toml) pin, for the same reason.
rmcp = { version = "1.8", default-features = false }
# Pinned to whatever rmcp's transport-streamable-http-client-reqwest
# feature itself depends on (confirmed via Cargo.lock) -- reqwest 0.12
# (the version openshell-sdk pulls in) and 0.13 are different major
# versions Cargo won't unify, and StreamableHttpClient is only implemented
# for rmcp's own reqwest::Client type.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[workspace.dependencies.tauri-build]
version = "2"
