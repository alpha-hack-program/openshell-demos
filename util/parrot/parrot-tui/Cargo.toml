[package]
name = "parrot-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "parrot"
path = "src/main.rs"

[dependencies]
parrot-core = { path = "../parrot-core" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
ratatui = "0.29"
crossterm = "0.28"
figlet-rs = "0.1"
# default-features off: we only copy plain text, so skip the image-data
# feature and the image/objc2-core-graphics/windows-sys deps it pulls in.
arboard = { version = "3", default-features = false }
