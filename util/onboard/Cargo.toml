[package]
name = "onboard"
version = "0.1.2"
edition = "2024"
# test auto-trigger

[[bin]]
name = "onboard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"
