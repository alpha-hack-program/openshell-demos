<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1060" height="720" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="1060" height="56" rx="12" fill="url(#header-grad)"/>
  <rect x="0" y="40" width="1060" height="16" fill="url(#header-grad)"/>

  <!-- Title -->
  <text x="32" y="36" font-size="18" font-weight="700" fill="#f8fafc">Flow 6 — Sandbox Lifecycle</text>
  <text x="1028" y="36" font-size="12" fill="#94a3b8" text-anchor="end">User Flow</text>

  <!-- Actors -->
  <rect x="40" y="80" width="100" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="103" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">User</text>

  <rect x="280" y="80" width="160" height="36" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="360" y="103" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">OpenShell Gateway</text>

  <rect x="580" y="80" width="120" height="36" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="640" y="103" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">Sandbox Pod</text>

  <rect x="820" y="80" width="160" height="36" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="900" y="103" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Downstream API</text>

  <!-- Lifelines -->
  <line x1="90" y1="116" x2="90" y2="690" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="360" y1="116" x2="360" y2="690" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="640" y1="116" x2="640" y2="690" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="900" y1="116" x2="900" y2="690" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1: Create sandbox -->
  <line x1="90" y1="148" x2="348" y2="148" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="110" y="138" width="200" height="20" rx="4" fill="#f8fafc"/>
  <text x="210" y="152" font-size="11" fill="#4f46e5" text-anchor="middle">1. sandbox create --name demo</text>

  <!-- Gateway creates pod -->
  <line x1="360" y1="168" x2="628" y2="168" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="410" y="158" width="160" height="20" rx="4" fill="#fefce8"/>
  <text x="490" y="172" font-size="10" fill="#92400e" text-anchor="middle">Creates sandbox pod</text>

  <!-- Default policy note -->
  <rect x="560" y="194" width="200" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="660" y="210" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">Default policy:</text>
  <text x="660" y="224" font-size="9" fill="#b91c1c" text-anchor="middle">ALL outbound traffic blocked</text>

  <!-- Step 2: Try outbound (blocked) -->
  <line x1="90" y1="250" x2="628" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="240" width="280" height="20" rx="4" fill="#f8fafc"/>
  <text x="340" y="254" font-size="11" fill="#475569" text-anchor="middle">2. sandbox exec -- curl https://api.example.com</text>

  <line x1="640" y1="266" x2="888" y2="266" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="760" y="262" font-size="9" fill="#dc2626" text-anchor="middle">Blocked by policy</text>

  <line x1="628" y1="282" x2="102" y2="282" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <rect x="270" y="276" width="150" height="16" rx="4" fill="#fef2f2"/>
  <text x="345" y="287" font-size="9" fill="#dc2626" text-anchor="middle">Connection refused</text>

  <!-- Step 3: Attach provider -->
  <line x1="90" y1="314" x2="348" y2="314" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="100" y="304" width="220" height="20" rx="4" fill="#f8fafc"/>
  <text x="210" y="318" font-size="11" fill="#4f46e5" text-anchor="middle">3. sandbox provider attach demo user-&lt;id&gt;</text>

  <!-- Provider injects placeholder -->
  <line x1="360" y1="334" x2="628" y2="334" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="370" y="324" width="240" height="20" rx="4" fill="#fefce8"/>
  <text x="490" y="338" font-size="10" fill="#92400e" text-anchor="middle">$USER_ACCESS_TOKEN = resolve placeholder</text>

  <!-- Step 4: Update policy -->
  <line x1="90" y1="370" x2="348" y2="370" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="100" y="356" width="220" height="28" rx="4" fill="#f8fafc"/>
  <text x="210" y="372" font-size="11" fill="#4f46e5" text-anchor="middle">4. policy update demo</text>
  <text x="210" y="386" font-size="9" fill="#64748b" text-anchor="middle">--add-endpoint host:port  --binary /usr/bin/curl</text>

  <!-- Policy applied -->
  <line x1="360" y1="400" x2="628" y2="400" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="400" y="390" width="180" height="20" rx="4" fill="#dcfce7"/>
  <text x="490" y="404" font-size="10" fill="#166534" text-anchor="middle">Endpoint + binary allowed</text>

  <!-- Step 5: Connect -->
  <line x1="90" y1="434" x2="628" y2="434" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="200" y="424" width="280" height="20" rx="4" fill="#f8fafc"/>
  <text x="340" y="438" font-size="11" fill="#4f46e5" text-anchor="middle">5. sandbox connect demo (interactive session)</text>

  <!-- Step 6: Use — outbound call succeeds -->
  <line x1="90" y1="468" x2="628" y2="468" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="160" y="458" width="340" height="20" rx="4" fill="#f8fafc"/>
  <text x="330" y="472" font-size="11" fill="#475569" text-anchor="middle">6. curl -H "Authorization: Bearer $USER_ACCESS_TOKEN"</text>

  <!-- Gateway resolves placeholder -->
  <rect x="560" y="490" width="220" height="44" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="670" y="508" font-size="9" font-weight="600" fill="#3730a3" text-anchor="middle">Gateway proxy intercepts</text>
  <text x="670" y="522" font-size="9" fill="#4f46e5" text-anchor="middle">Swaps placeholder → real token</text>

  <!-- Request forwarded with real token -->
  <line x1="640" y1="544" x2="888" y2="544" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="690" y="534" width="160" height="20" rx="4" fill="#dcfce7"/>
  <text x="770" y="548" font-size="10" fill="#166534" text-anchor="middle">Bearer: real token</text>

  <!-- Response -->
  <line x1="888" y1="564" x2="102" y2="564" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="400" y="556" width="120" height="16" rx="4" fill="#dcfce7"/>
  <text x="460" y="567" font-size="9" fill="#166534" text-anchor="middle">200 OK + response</text>

  <!-- Step 7: Delete -->
  <line x1="90" y1="600" x2="348" y2="600" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="110" y="590" width="200" height="20" rx="4" fill="#f8fafc"/>
  <text x="210" y="604" font-size="11" fill="#475569" text-anchor="middle">7. sandbox delete demo</text>

  <line x1="360" y1="620" x2="628" y2="620" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="610" width="140" height="20" rx="4" fill="#f1f5f9"/>
  <text x="490" y="624" font-size="10" fill="#64748b" text-anchor="middle">Pod terminated</text>

  <!-- Key insight -->
  <rect x="40" y="652" width="980" height="30" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="530" y="672" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">The real secret never enters the sandbox — the proxy resolves the placeholder at the gateway boundary</text>
</svg>