<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#db2777"/>
    </marker>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1060" height="760" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="1060" height="56" rx="12" fill="url(#header-grad)"/>
  <rect x="0" y="40" width="1060" height="16" fill="url(#header-grad)"/>

  <!-- Title -->
  <text x="32" y="36" font-size="18" font-weight="700" fill="#f8fafc">Flow 5 — Gateway Connection: mTLS vs OIDC</text>
  <text x="1028" y="36" font-size="12" fill="#94a3b8" text-anchor="end">User Flow</text>

  <!-- ===== TOP HALF: mTLS ===== -->
  <rect x="20" y="72" width="1020" height="22" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
  <text x="32" y="87" font-size="10" font-weight="700" fill="#92400e">mTLS ONLY — machine identity, no per-user distinction</text>

  <!-- mTLS actors -->
  <rect x="60" y="108" width="120" height="32" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="129" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">CLI (User)</text>

  <rect x="460" y="108" width="160" height="32" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="540" y="129" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">OpenShell Gateway</text>

  <!-- mTLS lifelines -->
  <line x1="120" y1="140" x2="120" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="540" y1="140" x2="540" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1: CLI presents client cert -->
  <line x1="120" y1="166" x2="528" y2="166" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="156" width="220" height="20" rx="4" fill="#fefce8"/>
  <text x="310" y="170" font-size="11" fill="#92400e" text-anchor="middle">1. TLS handshake + client cert</text>

  <!-- Step 2: Gateway verifies -->
  <rect x="480" y="194" width="120" height="28" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="540" y="213" font-size="10" fill="#92400e" text-anchor="middle">2. Verify cert CA</text>

  <!-- Step 3: No JWT check -->
  <rect x="480" y="232" width="200" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="580" y="250" font-size="10" fill="#64748b" text-anchor="middle">3. JWT check skipped</text>
  <text x="700" y="250" font-size="9" fill="#94a3b8">(allowUnauth=true)</text>

  <!-- Step 4: Connected -->
  <line x1="528" y1="278" x2="132" y2="278" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="220" y="268" width="200" height="20" rx="4" fill="#dcfce7"/>
  <text x="320" y="282" font-size="11" fill="#166534" text-anchor="middle">4. Authenticated (mTLS)</text>

  <!-- mTLS identity note -->
  <rect x="700" y="160" width="300" height="50" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="850" y="178" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">Identity = shared client cert</text>
  <text x="850" y="194" font-size="9" fill="#a16207" text-anchor="middle">All users with this cert are identical</text>
  <text x="850" y="206" font-size="9" fill="#a16207" text-anchor="middle">to the gateway — no RBAC possible</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="20" y1="360" x2="1040" y2="360" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== BOTTOM HALF: OIDC ===== -->
  <rect x="20" y="376" width="1020" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.5"/>
  <text x="32" y="391" font-size="10" font-weight="700" fill="#3730a3">mTLS + OIDC — per-user identity with roles</text>

  <!-- OIDC actors -->
  <rect x="40" y="412" width="100" height="32" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="433" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">CLI</text>

  <rect x="240" y="412" width="100" height="32" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="290" y="433" font-size="12" font-weight="600" fill="#6b21a8" text-anchor="middle">Browser</text>

  <rect x="460" y="412" width="120" height="32" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="520" y="433" font-size="12" font-weight="600" fill="#9d174d" text-anchor="middle">Keycloak</text>

  <rect x="700" y="412" width="160" height="32" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="780" y="433" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">OpenShell Gateway</text>

  <!-- OIDC lifelines -->
  <line x1="90" y1="444" x2="90" y2="730" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="290" y1="444" x2="290" y2="730" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="520" y1="444" x2="520" y2="730" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="780" y1="444" x2="780" y2="730" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1: CLI opens browser -->
  <line x1="90" y1="470" x2="278" y2="470" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="110" y="460" width="140" height="20" rx="4" fill="#f8fafc"/>
  <text x="180" y="474" font-size="11" fill="#6b21a8" text-anchor="middle">1. Open browser</text>

  <!-- Step 2: Browser redirects to Keycloak -->
  <line x1="290" y1="494" x2="508" y2="494" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
  <rect x="310" y="484" width="170" height="20" rx="4" fill="#f8fafc"/>
  <text x="395" y="498" font-size="11" fill="#9d174d" text-anchor="middle">2. Redirect to /authorize</text>

  <!-- Step 3: User authenticates -->
  <rect x="470" y="518" width="100" height="28" rx="4" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1"/>
  <text x="520" y="536" font-size="10" fill="#9d174d" text-anchor="middle">3. User login</text>

  <!-- Step 4: Auth code callback -->
  <line x1="508" y1="558" x2="102" y2="558" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-pink)"/>
  <rect x="180" y="548" width="240" height="20" rx="4" fill="#fdf2f8"/>
  <text x="300" y="562" font-size="11" fill="#9d174d" text-anchor="middle">4. Callback with authorization code</text>

  <!-- Step 5: Exchange code for tokens -->
  <line x1="90" y1="588" x2="508" y2="588" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
  <rect x="180" y="578" width="240" height="20" rx="4" fill="#f8fafc"/>
  <text x="300" y="592" font-size="11" fill="#9d174d" text-anchor="middle">5. Exchange code → access + refresh</text>

  <line x1="508" y1="604" x2="102" y2="604" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-pink)"/>
  <rect x="210" y="596" width="180" height="16" rx="4" fill="#fdf2f8"/>
  <text x="300" y="607" font-size="9" fill="#9d174d" text-anchor="middle">{ access_token (JWT), refresh_token }</text>

  <!-- Step 6: gRPC call with both auth layers -->
  <line x1="90" y1="636" x2="768" y2="636" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="240" y="622" width="340" height="28" rx="4" fill="#f8fafc"/>
  <text x="410" y="638" font-size="11" fill="#4f46e5" text-anchor="middle">6. gRPC call: client cert + Authorization: Bearer JWT</text>
  <text x="410" y="652" font-size="9" fill="#64748b" text-anchor="middle">Both transport (mTLS) and application (JWT) layers active</text>

  <!-- Step 7: Gateway validates both -->
  <rect x="710" y="662" width="140" height="40" rx="4" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="780" y="678" font-size="9" font-weight="600" fill="#3730a3" text-anchor="middle">7. Validate both:</text>
  <text x="780" y="694" font-size="9" fill="#4f46e5" text-anchor="middle">cert CA + JWT sig/iss/roles</text>

  <!-- Step 8: Authenticated with identity -->
  <line x1="768" y1="714" x2="102" y2="714" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="240" y="704" width="340" height="20" rx="4" fill="#dcfce7"/>
  <text x="410" y="718" font-size="11" fill="#166534" text-anchor="middle">8. Authenticated (mTLS + OIDC) — user identity + roles</text>

  <!-- OIDC identity note -->
  <rect x="880" y="470" width="160" height="72" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="960" y="488" font-size="10" font-weight="600" fill="#3730a3" text-anchor="middle">JWT carries</text>
  <text x="960" y="504" font-size="9" fill="#4f46e5" text-anchor="middle">sub: user identity</text>
  <text x="960" y="518" font-size="9" fill="#4f46e5" text-anchor="middle">realm_access.roles:</text>
  <text x="960" y="532" font-size="9" fill="#4f46e5" text-anchor="middle">  openshell-user, ...</text>
</svg>