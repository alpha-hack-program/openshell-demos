# Path A — mature path, no SPIRE required.
id: customer-scoped-api
display_name: Customer-scoped API
description: Per-customer OAuth credential, refreshed via each customer's own token
category: data
inference_capable: false

credentials:
  - name: customer_access_token
    description: Short-lived access token scoped to one customer
    env_vars: [CUSTOMER_ACCESS_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization

refresh:
  strategy: oauth2_refresh_token
  token_url: "https://<keycloak-host>/realms/openshell/protocol/openid-connect/token"
  scopes: [openid, offline_access]
  refresh_before_seconds: 300
  max_lifetime_seconds: 3600
  material:
    - name: client_id
      required: true
      secret: false
    - name: refresh_token
      required: true
      secret: true
    - name: client_secret
      required: true
      secret: true

endpoints:
  - host: api.yourdownstream.example.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/bin/curl
