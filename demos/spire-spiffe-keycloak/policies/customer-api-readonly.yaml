network_policies:
  customer_api_readonly:
    name: customer_api_readonly
    endpoints:
      - host: api.yourdownstream.example.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /v1/**
    binaries:
      - path: /usr/bin/curl
