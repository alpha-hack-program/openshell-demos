# Self-contained Helm values for the keycloak-oidc demo on OpenShift.
#
#   helm upgrade --install openshell oci://ghcr.io/nvidia/openshell/helm-chart \
#     --version "$OPENSHELL_CHART_VERSION" --namespace "$OPENSHELL_NAMESPACE" \
#     -f demos/keycloak-oidc/helm/values.yaml

# OpenShift-compatibility overrides — OpenShift's admission controller must
# assign these itself.
podSecurityContext:
  fsGroup: null

securityContext:
  runAsUser: null

server:
  auth:
    allowUnauthenticatedUsers: false   # real OIDC is configured below
  oidc:
    issuer: "https://<keycloak-host>/realms/openshell"     # fill in from .env
    audience: "openshell-cli"
    rolesClaim: "realm_access.roles"
    adminRole: "openshell-admin"
    userRole: "openshell-user"
  providerTokenGrants:
    spiffe:
      enabled: true          # Path B (stretch) only — leave false if only doing Path A
      workloadApiSocketPath: "/spiffe-workload-api/spire-agent.sock"

openshiftRoute:
  enabled: true
  # host is passed via --set at install time (depends on namespace + cluster domain)
