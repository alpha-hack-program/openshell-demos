# Renders OpenClaw's own config file (JSON5, but plain JSON is valid
# JSON5). Mounted at /home/node/.openclaw/openclaw.json — see
# ../../images/openclaw-openshell/Containerfile and docs.openclaw.ai's
# Kubernetes guide for that path.
#
# This is a Secret, not a ConfigMap, because the reliable way to point
# OpenClaw at a BYO/custom Anthropic-compatible endpoint is
# models.providers.anthropic.baseUrl + an inline apiKey in this same
# config object — confirmed via OpenClaw's own docs and a GitHub issue
# (openclaw/openclaw#56679) showing the ANTHROPIC_BASE_URL env var alone
# is unreliable across gateway versions. ../scripts/13-deploy-openclaw.sh
# reads the actual key out of the openclaw-secrets Secret at deploy time
# and passes it via --set-string — it never lands in a committed file.
#
# plugins.entries.openshell.config does NOT accept a "workspace" key —
# confirmed live against the actually-installed plugin version
# (@openclaw/openshell-sandbox@2026.7.1 — the newest version compatible
# with this OpenClaw gateway build; @2026.9.2 resolved but was rejected as
# incompatible at install time, so docs.openclaw.ai's current schema
# reference may describe a newer plugin than what's actually installable
# here). Workspace selection for the older plugin goes through the
# OPENSHELL_WORKSPACE env var on the openclaw container instead (see
# ../templates/deployment.yaml) — this matches
# docs/headless-browser-automation.md's note that the openshell CLI reads
# OPENSHELL_WORKSPACE as an ambient env var.
#
# gateway.auth.trustedProxy schema confirmed against
# docs.openclaw.ai/gateway/trusted-proxy-auth. Two things worth flagging:
# - gateway.auth.mode: "trusted-proxy" and a configured shared token
#   (gateway.auth.token / OPENCLAW_GATEWAY_TOKEN env var) are documented as
#   mutually exclusive — the Deployment intentionally does NOT set
#   OPENCLAW_GATEWAY_TOKEN.
# - trustedProxies/allowLoopback are set for 127.0.0.1 because oauth2-proxy
#   runs as a sidecar in the SAME pod network namespace (loopback), not a
#   separate Service — confirmed live that the pod otherwise refuses to
#   start with "gateway: Invalid input" until gateway.mode + the full
#   auth.trustedProxy nesting (not a bare gateway.trustedProxy) are both
#   present.
#
# gateway.controlUi.allowedOrigins: OpenClaw's Control UI (its own chat
# frontend, served over the same port as the gateway) does its own
# WebSocket-origin check independent of the HTTP-layer trusted-proxy auth
# above. It only auto-seeds localhost/127.0.0.1 origins — confirmed live
# that logging in successfully through oauth2-proxy still lands on a
# "Browser origin not allowed" page until the external Route origin is
# added here explicitly.
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-config
  labels:
    app.kubernetes.io/name: openclaw
stringData:
  openclaw.json: |
    {
      "plugins": {
        "allow": ["openshell"],
        "entries": {
          "openshell": {
            "enabled": true,
            "config": {
              "gateway": {{ .Values.openshell.gatewayName | quote }},
              "gatewayEndpoint": "https://{{ required "gatewayRouteHost is required — the OpenShell gateway's own external Route host" .Values.gatewayRouteHost }}:443",
              "command": {{ .Values.openshell.command | quote }}
            }
          }
        }
      },
      "gateway": {
        "mode": "local",
        "trustedProxies": ["127.0.0.1"],
        "controlUi": {
          "allowedOrigins": ["https://{{ required "route.host is required" .Values.route.host }}"]
        },
        "auth": {
          "mode": "trusted-proxy",
          "trustedProxy": {
            "userHeader": "x-forwarded-user",
            "allowUsers": [{{ .Values.oauthProxy.allowedUser | quote }}],
            "allowLoopback": true
          }
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "anthropic": {
            "api": "anthropic-messages",
            "apiKey": {{ required "llm.apiKey is required — pass it via --set-string at deploy time, never commit it" .Values.llm.apiKey | quote }}
            {{- if .Values.llm.baseUrl }},
            "baseUrl": {{ .Values.llm.baseUrl | quote }}
            {{- end }}
          }
        }
      }
    }
