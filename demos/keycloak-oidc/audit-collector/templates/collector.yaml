# metadata.name is deliberately fixed to "audit", not templated on
# .Release.Name — the OpenTelemetry Operator names the generated Service
# "<name>-collector", and that exact string ("audit-collector") is
# compiled into session-auditor's binary as its OTLP push target (see
# util/session-auditor/otlp-endpoint.txt). Renaming this release would
# silently break that without a matching binary rebuild.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: audit
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        # Confirmed live this defaults to false, which made every metric
        # sample carry the *scrape* time, not session-auditor's own push
        # time — audit-dashboard's `timestamp(...)` queries (used to
        # distinguish which of several still-live session_id series is
        # actually most recent, see util/audit-dashboard) were therefore
        # comparing "time of last scrape" across series, which is
        # meaningless since every live series gets re-scraped on the same
        # cycle regardless of when it was actually pushed. Setting this
        # true makes Prometheus preserve the real OTLP push timestamp.
        send_timestamps: true
      # Kept alongside the real otlp_http/tempo exporter below as cheap
      # insurance: `oc logs` on this pod stays a working way to confirm
      # spans are actually arriving even if Tempo ingestion itself is
      # silently broken (wrong Service name, TLS mismatch, etc.) — the
      # exact kind of failure that's easy to introduce and hard to notice
      # otherwise. Remove once the Tempo path has been reliable for a while.
      debug:
        verbosity: detailed
      # Forwards traces to demos/keycloak-oidc/audit-tempo's TempoMonolithic
      # instance. Service name/port confirmed live (not guessed) — see
      # audit-tempo/README.md's Install section for how to re-verify if that
      # release is ever renamed. insecure:true because this in-namespace
      # hop has no TLS today, matching audit-tempo's own "no auth on
      # ingest" documented limitation (also demo-only, not a production
      # pattern).
      otlp_http/tempo:
        endpoint: http://tempo-audit:4318
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          exporters: [debug, otlp_http/tempo]
