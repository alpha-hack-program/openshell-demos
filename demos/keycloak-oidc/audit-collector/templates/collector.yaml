# metadata.name is deliberately fixed to "audit", not templated on
# .Release.Name — the OpenTelemetry Operator names the generated Service
# "<name>-collector", and that exact string ("audit-collector") is
# compiled into session-auditor's binary as its OTLP push target (see
# util/session-auditor/otlp-endpoint.txt). Renaming this release would
# silently break that without a matching binary rebuild.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: audit
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
      # Spike/PoC only (see demos/keycloak-oidc/docs — OTel traces
      # investigation): dumps received spans to the collector pod's own
      # stdout so `oc logs` can confirm Claude Code/Codex native tracing
      # actually reaches this collector, with what resource attributes and
      # span shape. Not a real trace backend — swap for a Tempo exporter
      # before relying on this for anything beyond validation.
      debug:
        verbosity: detailed
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          exporters: [debug]
