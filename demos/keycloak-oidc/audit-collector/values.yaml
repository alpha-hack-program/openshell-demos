# Whether to render a ServiceMonitor alongside the collector, so
# openshift-user-workload-monitoring scrapes its Prometheus exporter.
# Disable if you'd rather wire scraping up yourself.
serviceMonitor:
  enabled: true
  interval: 15s

# Renders a PrometheusRule alerting on session_compliance_risk_score --
# fires visibly in OpenShift's own console (Observe -> Alerting) with no
# extra cluster config needed. riskThreshold 2 matches "blocked_attempt"
# or worse (see util/session-auditor/prompt.txt's score scheme). Routing
# the alert externally needs a cluster-wide opt-in this chart can't
# enable on its own -- see README.md's "Known limitations".
alerting:
  enabled: true
  riskThreshold: 2
  severity: warning
  forDuration: 0m
  # Keeps the alert visibly firing for at least this long even after the
  # underlying score drops or the metric goes stale -- see
  # templates/prometheusrule.yaml's own comment for why.
  keepFiringFor: 15m
