image:
  repository: quay.io/atarazana/audit-dashboard
  tag: 0.1.13
  pullPolicy: IfNotPresent

# Optional — leave empty to let OpenShift auto-generate a hostname (this
# app has no OAuth callback to pre-register anywhere, unlike
# onboarding-web, so there's no fixed-URL requirement forcing an explicit
# value).
route:
  host: ""

# Thanos-querier is the tenancy-aware front door for
# openshift-user-workload-monitoring — it enforces namespace-scoped RBAC
# via this chart's own ServiceAccount (see templates/clusterrolebinding.yaml)
# rather than trusting the query's own namespace label alone. [VERIFY] this
# default host/port against your cluster.
prometheus:
  thanosQuerierUrl: https://thanos-querier.openshift-monitoring.svc:9091

# demos/keycloak-oidc/audit-tempo's own Service — plain in-namespace HTTP,
# no auth, no CA trust needed (unlike Thanos-querier above). Must already
# be deployed; see audit-tempo/README.md.
tempo:
  url: http://tempo-audit:3200

refreshIntervalSecs: 5
heartbeatStaleSecs: 90
maxEvents: 50

# Only used by sandboxes provisioned with `--gw` (gateway-routed MCP).
# Those reach every server through one broker entry, so the agent reports
# a single tool namespace (`mcp__gateway__...`) and the graph would show
# one `gateway` node instead of an edge per server. The gateway stamps the
# backend onto the tool itself
# (`mcp__gateway__mcp_portfolio_get_positions`), so listing its prefixes
# here recovers the real edges.
#
# These must match each `MCPServerRegistration.spec.prefix` exactly:
#   oc get mcpserverregistration -A -o custom-columns=NAME:.metadata.name,PREFIX:.spec.prefix
#
# It has to be configured rather than inferred: nothing in
# `mcp_market_news_get_relevant_news` marks where the server name ends, so
# `market` and `market_news` are equally valid splits. A tool matching no
# prefix still appears, collapsed under the broker's name, rather than
# being dropped. Harmless to leave set for direct-access sandboxes — their
# tool names never carry these prefixes.
mcpGateway:
  toolPrefixes:
    - mcp_portfolio_
    - mcp_crm_calendar_
    - mcp_market_news_
    - mcp_kyc_compliance_
    - mcp_compatibility_
  # Agent MCP-config keys that name the gateway rather than a real server.
  # codex-cli tags its MCP *connection* spans with the config key, which on
  # a gateway-routed sandbox is this single broker entry no matter which
  # backend served the call — so without this the graph draws one `gateway`
  # edge and hides every real server. Listed keys are ignored on connection
  # spans; those sandboxes get their edges from tool spans instead, where
  # the backend is recoverable from the stamped tool prefix above.
  # Must match the `[mcp_servers.<key>]` table name that
  # scripts/14-provision-codex-sandbox.sh --gw writes into config.toml.
  serverKeys:
    - gateway

# A sandbox/MCP-server node is never removed from the graph once observed
# (see util/audit-dashboard/src/main.rs's refresh_graph) — it only ever
# dims when its heartbeat goes stale. This PVC is what makes that survive
# a pod restart too, instead of resetting to an empty graph until
# Prometheus re-populates it.
persistence:
  enabled: true
  size: 256Mi
  storageClassName: ""

resources: {}
