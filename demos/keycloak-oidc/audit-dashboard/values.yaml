image:
  repository: quay.io/atarazana/audit-dashboard
  tag: 0.1.8
  pullPolicy: IfNotPresent

# Optional — leave empty to let OpenShift auto-generate a hostname (this
# app has no OAuth callback to pre-register anywhere, unlike
# onboarding-web, so there's no fixed-URL requirement forcing an explicit
# value).
route:
  host: ""

# Thanos-querier is the tenancy-aware front door for
# openshift-user-workload-monitoring — it enforces namespace-scoped RBAC
# via this chart's own ServiceAccount (see templates/clusterrolebinding.yaml)
# rather than trusting the query's own namespace label alone. [VERIFY] this
# default host/port against your cluster.
prometheus:
  thanosQuerierUrl: https://thanos-querier.openshift-monitoring.svc:9091

# demos/keycloak-oidc/audit-tempo's own Service — plain in-namespace HTTP,
# no auth, no CA trust needed (unlike Thanos-querier above). Must already
# be deployed; see audit-tempo/README.md.
tempo:
  url: http://tempo-audit:3200

refreshIntervalSecs: 5
heartbeatStaleSecs: 90
maxEvents: 50

# A sandbox/MCP-server node is never removed from the graph once observed
# (see util/audit-dashboard/src/main.rs's refresh_graph) — it only ever
# dims when its heartbeat goes stale. This PVC is what makes that survive
# a pod restart too, instead of resetting to an empty graph until
# Prometheus re-populates it.
persistence:
  enabled: true
  size: 256Mi
  storageClassName: ""

resources: {}
