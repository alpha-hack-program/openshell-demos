# Confirmed live (2026-09-08, sandbox268) — the first workload in this
# repo to call openshift-user-workload-monitoring's Thanos-querier
# in-cluster (the only prior precedent, ../audit-collector/README.md, is
# an admin's `oc exec` straight into the Prometheus pod). Binding the
# dashboard's own ServiceAccount to the built-in `cluster-monitoring-view`
# ClusterRole is sufficient on its own — no extra RoleBinding, annotation,
# or namespace-scoped grant needed. The actual first-run failure mode
# wasn't RBAC at all; it was TLS (see util/audit-dashboard/src/main.rs's
# build_http_client doc comment) — worth knowing before assuming a 403
# here if something looks broken.
#
# A ClusterRoleBinding (not a namespaced RoleBinding) because
# `cluster-monitoring-view` is a ClusterRole and Thanos-querier's own RBAC
# check is cluster-scoped, even though the queries this SA issues are
# themselves namespace-filtered (see values.yaml's namespace-scoped
# `namespace="..."` label matcher, enforced app-side in
# util/audit-dashboard's own PromQL, not by this binding).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: audit-dashboard-{{ .Release.Namespace }}-monitoring-view
  labels:
    app.kubernetes.io/name: audit-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: audit-dashboard
    namespace: {{ .Release.Namespace }}
