id: byo-codex
display_name: BYO LLM (Codex policy)
description: Network policy and binary permissions for Codex against a BYO LLM
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: LLM API key (injected as OPENAI_API_KEY for Codex)
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

endpoints:
  # Was inference.local:443 (OpenShell's privacy router) until 0.1.2
  # removed `openshell inference` entirely, taking the route with it. Codex
  # now talks to the LLM endpoint directly, exactly as byo-claude does, and
  # <llm-host>/<llm-port> are substituted by
  # scripts/14-provision-codex-sandbox.sh from CODEX_BASE_URL.
  #
  # That endpoint must speak the OpenAI *Responses* API: codex-cli rejects
  # `wire_api = "chat"` outright since 0.146 ("no longer supported", a hard
  # config-load error), and sends MCP tools as `"type": "namespace"` tools
  # which only the Responses API carries. DeepSeek's own API serves this;
  # an OpenShift MaaS endpoint does not (its /v1/responses 500s), which is
  # why this profile's host is generally NOT the same endpoint the
  # OPENAI_* variables point at.
  - host: "<llm-host>"
    port: <llm-port>
    protocol: rest
    access: read-write
    enforcement: enforce
  # Native OTel traces (Codex's codex.exec_server.http_request spans, which
  # carry a real traceparent onto outbound MCP calls — see
  # demos/keycloak-oidc/docs) push here. Short, in-namespace DNS name
  # matches the same convention already used for session-auditor's own
  # identical grant (see session-auditor-anthropic-profile.yaml /
  # session-auditor-openai-profile.yaml) and the hostname compiled into
  # util/session-auditor's binary (util/session-auditor/otlp-endpoint.txt).
  - host: "audit-collector.<openshell-namespace>.svc.cluster.local"
    port: 4318
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/bin/codex
  - /usr/local/bin/codex
  - /usr/bin/curl
