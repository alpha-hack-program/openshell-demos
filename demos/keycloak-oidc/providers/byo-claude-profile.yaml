id: byo-claude
display_name: BYO LLM (Claude Code compatible)
description: OpenAI-compatible LLM for Claude Code
category: inference
inference_capable: true

credentials:
  # Bearer rather than x-api-key, and therefore ANTHROPIC_AUTH_TOKEN rather
  # than ANTHROPIC_API_KEY, because that is the only form both supported
  # endpoint styles accept. Claude Code picks the header from whichever of
  # the two env vars is set: ANTHROPIC_API_KEY -> `x-api-key`,
  # ANTHROPIC_AUTH_TOKEN -> `Authorization: Bearer`.
  #
  # An OpenShift MaaS / AI-Gateway endpoint rejects `x-api-key` outright
  # (401) and requires Bearer. Anthropic-compatible vendor endpoints such
  # as DeepSeek's /anthropic accept either, so Bearer works against both --
  # verified live against each. `header_name` must stay lowercase
  # `authorization` to match the proxy's own matching, same as
  # user-refresh-profile.yaml.
  #
  # Note this is the *sandbox-side* env var name only. .env still calls the
  # value ANTHROPIC_API_KEY; scripts/15 maps it across.
  - name: api_key
    description: LLM API key, injected as ANTHROPIC_AUTH_TOKEN for Claude Code
    env_vars: [ANTHROPIC_AUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization

endpoints:
  # <llm-host>/<llm-port> are both substituted by
  # scripts/15-provision-claude-sandbox.sh from ANTHROPIC_BASE_URL — port
  # defaults to 443 there if the URL doesn't specify one, but a plain
  # http:// in-cluster endpoint (e.g. a KServe InferenceService's own
  # ClusterIP Service, bypassing the external Route + forward-proxy TLS
  # termination path entirely) needs its real port here, not a
  # hardcoded 443.
  - host: "<llm-host>"
    port: <llm-port>
    protocol: rest
    access: read-write
    enforcement: enforce
  # Native OTel traces (Claude Code's own tool-call spans, which carry a
  # real traceparent onto outbound MCP calls — see demos/keycloak-oidc/docs)
  # push here. Short, in-namespace DNS name matches the same convention
  # already used for session-auditor's own identical grant (see
  # session-auditor-anthropic-profile.yaml / session-auditor-openai-profile.yaml)
  # and the hostname compiled into util/session-auditor's binary
  # (util/session-auditor/otlp-endpoint.txt).
  - host: "audit-collector.<openshell-namespace>.svc.cluster.local"
    port: 4318
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/claude
  - /usr/bin/curl
