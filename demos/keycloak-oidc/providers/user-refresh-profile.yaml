id: user-scoped-api
display_name: User-scoped API
description: Per-user OAuth credential, refreshed via each user's own token
category: data
inference_capable: false

credentials:
  - name: user_access_token
    description: Short-lived access token scoped to one user
    env_vars: [USER_ACCESS_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: "https://<keycloak-host>/realms/openshell/protocol/openid-connect/token"
      scopes: [openid, offline_access]
      refresh_before_seconds: 300

endpoints:
  # The MCP Gateway's public host, used when a sandbox is provisioned with
  # `--gw` (scripts/15-provision-claude-sandbox.sh) and therefore reaches
  # every server through one broker endpoint instead of the five in-cluster
  # hosts below. Without this entry the proxy refuses to inject
  # USER_ACCESS_TOKEN and the gateway returns
  # {"error":"credential_endpoint_mismatch"} — the credential is only
  # injected for endpoints listed here. It is a separate entry rather than a
  # replacement because both access paths stay supported; a direct-access
  # (no `--gw`) sandbox never contacts this host.
  - host: "<mcp-gateway-host>"
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "mcp-compatibility.<openshell-namespace>.svc.cluster.local"
    port: 8000
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "mcp-portfolio.<openshell-namespace>.svc.cluster.local"
    port: 8000
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "mcp-crm-calendar.<openshell-namespace>.svc.cluster.local"
    port: 8000
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "mcp-market-news.<openshell-namespace>.svc.cluster.local"
    port: 8000
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "mcp-kyc-compliance.<openshell-namespace>.svc.cluster.local"
    port: 8000
    protocol: rest
    access: read-write
    enforcement: enforce
