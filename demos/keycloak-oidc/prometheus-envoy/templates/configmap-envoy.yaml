apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-envoy
  labels:
    app.kubernetes.io/name: prometheus-envoy
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              http_filters:
              # Extract the target sandbox's Host-header routing key from
              # the request path (/route/<host-key>/<rest>) and rewrite
              # :authority to it — this is the actual workaround, since the
              # caller (e.g. a Prometheus ServiceMonitor) can't set a custom
              # header (see Chart.yaml description).
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_request(request_handle)
                        local path = request_handle:headers():get(":path")
                        local host_key, rest = path:match("^/route/([^/]+)(/.*)$")
                        if host_key then
                          request_handle:headers():replace(":authority", host_key)
                          request_handle:headers():replace(":path", rest)
                        else
                          request_handle:respond({[":status"] = "400"}, "missing /route/<host-key>/... prefix")
                        end
                      end
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: gateway_cluster, timeout: 120s }
      clusters:
      - name: gateway_cluster
        type: STRICT_DNS
        connect_timeout: 5s
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: gateway_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.gateway.host | default (printf "openshell.%s.svc.cluster.local" .Release.Namespace) | quote }}
                    port_value: {{ .Values.gateway.port }}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            {{- if .Values.insecureSkipVerifyGateway }}
            common_tls_context:
              validation_context:
                trust_chain_verification: ACCEPT_UNTRUSTED
            {{- end }}
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
