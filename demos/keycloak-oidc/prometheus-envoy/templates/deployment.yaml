apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-envoy
  labels:
    app.kubernetes.io/name: prometheus-envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-envoy
    spec:
      containers:
      - name: envoy
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        args: ["-c", "/etc/envoy/envoy.yaml"]
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: prometheus-envoy
