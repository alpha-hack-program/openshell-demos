# Rendered with `helm template <release-name> policies --set ...`, never
# `helm install` — there is no in-cluster release, this chart only produces
# a policy YAML/JSON file for `openshell policy set --policy <file>`.
#
# All four values below are required; the template fails fast (via `fail`)
# if any is left at its empty default. Pass them with --set, e.g.:
#
#   helm template demo-alice policies \
#     --set openshellNamespace=keycloak-oidc-demo \
#     --set llmHost=api.deepseek.com \
#     --set recipe=claude-code \
#     --set 'mcpServers={mcp-portfolio,mcp-crm-calendar,mcp-market-news,mcp-kyc-compliance,mcp-compatibility}'
#
# llmModel is deliberately not a value here: the model name never appears
# in a network policy (no host/port/binary rule depends on it) — it's
# config passed to the agent via --env at exec time, not a policy grant.

# In-cluster hostname suffix for MCP servers:
# <mcpServer>.<openshellNamespace>.svc.cluster.local
openshellNamespace: ""

# Hostname only (no scheme, no path) of the BYO LLM endpoint, e.g. api.deepseek.com
llmHost: ""

# Which built-in agent-harness bundle + binary to grant: claude-code | codex
recipe: claude-code

# MCP server short names this sandbox may reach. Each becomes its own
# network_policies group, e.g. mcp-portfolio -> allow_mcp_portfolio,
# granting <name>.<openshellNamespace>.svc.cluster.local:8000. Mutually
# exclusive with mcpGatewayHost below — set exactly one.
mcpServers: []

# Gateway-routed access instead of the per-server mcpServers list above:
# grants egress to the RHCL MCP Gateway's single in-cluster broker
# endpoint (../mcp-gateway's MCPGatewayExtension spec.privateHost,
# scheme/path stripped — see scripts/lib-mcp-gateway.sh) as one
# allow_mcp_gateway group, since every server's tools are reached through
# this one /mcp endpoint instead of each server's own direct port. Set by
# 14/15/16's --gw flag; mutually exclusive with mcpServers.
mcpGatewayHost: ""
mcpGatewayPort: 8080

# MLflow tracing (optional — see docs/mlflow-tracing.md and
# util/session-auditor/README.md's "MLflow tracing (Codex only)" section).
# Leave empty to omit the allow_mlflow group entirely, which is the same as
# never setting MLFLOW_TRACKING_URI at exec time: tracing just doesn't
# happen, nothing else is affected. Set to the in-cluster MLflow service
# hostname, e.g. mlflow.redhat-ods-applications.svc.cluster.local, to let
# claude's Stop-hook reach it; the hook runs as a child process of
# claude/node, so the allow_mlflow group grants those same binaries (plus
# python3, since the 3.12 Python-hook path's own tracing client is a
# python3 subprocess). For Codex, session-auditor itself opens this
# connection in-process (reqwest) — granted via its own binary entry, not
# `codex`, since codex never makes this call itself.
mlflowTrackingHost: ""
mlflowTrackingPort: 8443
