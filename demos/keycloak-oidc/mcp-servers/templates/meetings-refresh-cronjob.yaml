{{- $postgres := .Values.postgres -}}
{{- $needed := false -}}
{{- range .Values.servers -}}
  {{- if .database -}}{{- $needed = true -}}{{- end -}}
{{- end -}}
{{- if $needed }}
# Daily backstop for schema-init-job.yaml's one-shot meetings refresh: that
# Job only runs on `helm install`/`upgrade`, so a demo left running for
# several days without a redeploy would still go stale between deploys.
# This CronJob runs the same idempotent 0003_meetings_refresh.sql query on
# a schedule instead, so `get_upcoming_meetings` never stays empty for more
# than a day regardless of when the demo was last deployed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mcp-servers-meetings-refresh
  labels:
    app.kubernetes.io/name: mcp-servers-meetings-refresh
    app.kubernetes.io/part-of: mcp-servers
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mcp-servers-meetings-refresh
        spec:
          restartPolicy: Never
          containers:
            - name: meetings-refresh
              image: "{{ $postgres.image.repository }}:{{ $postgres.image.tag }}"
              imagePullPolicy: {{ $postgres.image.pullPolicy | default "IfNotPresent" }}
              env:
                - name: PGHOST
                  value: "mcp-postgres"
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: {{ $postgres.database | quote }}
                - name: PGUSER
                  value: {{ $postgres.user | quote }}
                - name: PGPASSWORD
                  value: {{ $postgres.password | quote }}
              command:
                - /bin/bash
                - -ec
                - |
                  echo "Refreshing any stale meetings from /sql/0003_meetings_refresh.sql..."
                  psql -v ON_ERROR_STOP=1 -f /sql/0003_meetings_refresh.sql
                  echo "Done."
              volumeMounts:
                - name: sql
                  mountPath: /sql
                  readOnly: true
          volumes:
            - name: sql
              configMap:
                name: mcp-servers-schema-sql
{{- end }}
