{{- $keycloak := .Values.keycloak -}}
{{- $envoy := .Values.envoy -}}
{{- $postgres := .Values.postgres -}}
{{- $newsGen := .Values.newsGenerator -}}
{{- $embeddings := .Values.embeddings -}}
{{- range .Values.servers }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: mcp-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: mcp-servers
    spec:
      serviceAccountName: {{ .name }}
      containers:
        # Actual token/role enforcement point — see values.yaml's envoy:
        # comment for why this exists. Listens on the port the Service
        # targets; the app container (below) is loopback-only and
        # unreachable except from this sidecar.
        - name: envoy
          image: "{{ $envoy.image.repository }}:{{ $envoy.image.tag }}"
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: http
              containerPort: {{ .port }}
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: internal
              containerPort: {{ .internalPort }}
          env:
            # These are NOT enforced by this image (confirmed: it accepts
            # any syntactically-valid bearer token regardless of role — see
            # README step 6). Kept as documentation of intent / in case a
            # future image version does implement its own check, but the
            # Envoy sidecar above is the actual enforcement point — do not
            # rely on these alone.
            - name: MCP_OIDC_ISSUER
              value: {{ $keycloak.issuer | quote }}
            - name: MCP_OIDC_CLIENT_ID
              value: {{ $keycloak.clientId | quote }}
            - name: MCP_REQUIRED_ROLE
              value: {{ .requiredRole | quote }}
            # Explicit loopback bind: some images (e.g. this repo's own
            # mcp-portfolio/mcp-crm-calendar/mcp-market-news, whose
            # Containerfiles bake ENV BIND_ADDRESS=0.0.0.0:<port>) do NOT
            # default to loopback on their own, which would make the app
            # reachable on the pod IP directly, bypassing Envoy's jwt_authn
            # + rbac checks entirely. Setting it here overrides any such
            # image default and keeps the app loopback-only regardless.
            - name: BIND_ADDRESS
              value: "127.0.0.1:{{ .internalPort }}"
            - name: MCP_DISABLE_HOST_CHECK
              value: "true"
            - name: MCP_STATEFUL_MODE
              value: {{ .statefulMode | default false | quote }}
            - name: RUST_LOG
              value: "debug"
            {{- if .database }}
            # Shared postgres — see values.yaml's postgres: block comment.
            - name: DATABASE_URL
              value: "postgres://{{ $postgres.user }}:{{ $postgres.password }}@mcp-postgres:5432/{{ $postgres.database }}"
            {{- end }}
            {{- if .newsGenerator }}
            # How often this process re-reads data/news.jsonl + data/news.tv
            # from the shared PVC below — picks up the news-generator-loop
            # sidecar's writes without a restart. See mcp-market-news's
            # README ("Live reload in mcp_server") for what this does.
            - name: NEWS_RELOAD_INTERVAL_MINUTES
              value: {{ $newsGen.intervalMinutes | default 5 | quote }}
            {{- end }}
            {{- if and .needsEmbeddings $embeddings.enabled }}
            # Shared vLLM/KServe embeddings InferenceService — see
            # values.yaml's embeddings: block and templates/embeddings.yaml.
            # Confirmed against a live cluster: the predictor Service
            # (`<isvc-name>-predictor`) is headless (clusterIP: None), so
            # there's no virtual-IP port translation — connecting on the
            # bare/default port 80 hits the pod directly on port 80, where
            # nothing listens. The container's actual port (8080) must be
            # given explicitly.
            - name: EMBEDDINGS_BASE_URL
              value: "http://{{ $embeddings.name }}-predictor.{{ $.Release.Namespace }}.svc.cluster.local:8080"
            - name: EMBEDDINGS_MODEL
              value: {{ $embeddings.name | quote }}
            {{- end }}
          resources:
            {{- toYaml (.resources | default dict) | nindent 12 }}
          {{- if .newsGenerator }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
        {{- if .newsGenerator }}
        # Keeps the corpus "live" for the length of a demo session without
        # anyone re-running news_generator by hand — see mcp-market-news's
        # README ("Continuous mode"). Its writes only reach traffic because
        # the app container above polls NEWS_RELOAD_INTERVAL_MINUTES.
        - name: news-generator-loop
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy | default "IfNotPresent" }}
          command: ["/app/news_generator"]
          env:
            - name: GENERATION_MODE
              value: "loop"
            - name: GENERATION_INTERVAL_MINUTES
              value: {{ $newsGen.intervalMinutes | default 5 | quote }}
            - name: GENERATION_BATCH_SIZE
              value: {{ $newsGen.batchSize | default 5 | quote }}
            - name: DATABASE_URL
              value: "postgres://{{ $postgres.user }}:{{ $postgres.password }}@mcp-postgres:5432/{{ $postgres.database }}"
            - name: OPENAI_API_KEY
              value: {{ $newsGen.openaiApiKey | quote }}
            - name: OPENAI_BASE_URL
              value: {{ $newsGen.openaiBaseUrl | quote }}
            - name: OPENAI_MODEL
              value: {{ $newsGen.openaiModel | quote }}
            {{- if and .needsEmbeddings $embeddings.enabled }}
            # news_generator also embeds each corpus item as it writes
            # news.tv (see mcp-market-news's src/bin/news_generator.rs) —
            # needs the same shared embeddings service as the app container.
            - name: EMBEDDINGS_BASE_URL
              value: "http://{{ $embeddings.name }}-predictor.{{ $.Release.Namespace }}.svc.cluster.local:8080"
            - name: EMBEDDINGS_MODEL
              value: {{ $embeddings.name | quote }}
            {{- end }}
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources: {}
        {{- end }}
      {{- if .newsGenerator }}
      # Blocks pod startup until a corpus exists (GENERATION_MODE defaults
      # to "once"), so mcp_server never hits the "No such file or
      # directory" crash a missing corpus used to cause — see
      # values.yaml's comment on this server's `newsGenerator: true`.
      initContainers:
        - name: news-generator-init
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy | default "IfNotPresent" }}
          command: ["/app/news_generator"]
          env:
            - name: DATABASE_URL
              value: "postgres://{{ $postgres.user }}:{{ $postgres.password }}@mcp-postgres:5432/{{ $postgres.database }}"
            - name: OPENAI_API_KEY
              value: {{ $newsGen.openaiApiKey | quote }}
            - name: OPENAI_BASE_URL
              value: {{ $newsGen.openaiBaseUrl | quote }}
            - name: OPENAI_MODEL
              value: {{ $newsGen.openaiModel | quote }}
            {{- if and .needsEmbeddings $embeddings.enabled }}
            # news_generator also embeds each corpus item as it writes
            # news.tv (see mcp-market-news's src/bin/news_generator.rs) —
            # needs the same shared embeddings service as the app container.
            - name: EMBEDDINGS_BASE_URL
              value: "http://{{ $embeddings.name }}-predictor.{{ $.Release.Namespace }}.svc.cluster.local:8080"
            - name: EMBEDDINGS_MODEL
              value: {{ $embeddings.name | quote }}
            {{- end }}
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources: {}
      {{- end }}
      volumes:
        - name: envoy-config
          configMap:
            name: {{ .name }}-envoy
        {{- if .newsGenerator }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .name }}-data
        {{- end }}
---
{{- if .newsGenerator }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}-data
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: mcp-servers
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $newsGen.pvcSize | default "1Gi" }}
---
{{- end }}
{{- end }}
