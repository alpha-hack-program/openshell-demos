{{- if .Values.mcpGateway.enabled }}
{{- $gw := .Values.mcpGateway -}}
{{- range .Values.servers }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-route
  namespace: {{ $gw.registrationNamespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: mcp-servers
    mcp-server: "true"
spec:
  parentRefs:
    - name: {{ $gw.gatewayName }}
      namespace: {{ $gw.gatewayNamespace }}
      sectionName: {{ $gw.sectionName }}
  hostnames:
    - '{{ .name }}.{{ $gw.internalDomain }}'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .name }}
          namespace: {{ $.Release.Namespace }}
          port: {{ $gw.gatewayPort }}
          weight: 1
---
{{- end }}
{{- end }}
