{{- $postgres := .Values.postgres -}}
{{- $needed := false -}}
{{- range .Values.servers -}}
  {{- if .database -}}{{- $needed = true -}}{{- end -}}
{{- end -}}
{{- if $needed }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-postgres
  labels:
    app.kubernetes.io/name: mcp-postgres
    app.kubernetes.io/part-of: mcp-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-postgres
        app.kubernetes.io/part-of: mcp-servers
    spec:
      containers:
        - name: postgresql
          image: "{{ $postgres.image.repository }}:{{ $postgres.image.tag }}"
          imagePullPolicy: {{ $postgres.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: {{ $postgres.database | quote }}
            - name: POSTGRESQL_USER
              value: {{ $postgres.user | quote }}
            - name: POSTGRESQL_PASSWORD
              value: {{ $postgres.password | quote }}
          resources:
            {{- toYaml ($postgres.resources | default dict) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-postgres
  labels:
    app.kubernetes.io/name: mcp-postgres
    app.kubernetes.io/part-of: mcp-servers
spec:
  selector:
    app.kubernetes.io/name: mcp-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
{{- end }}
