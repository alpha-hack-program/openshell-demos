{{- if and .Values.mcpGateway.enabled .Values.mcpGateway.auth.enabled }}
{{- $gw := .Values.mcpGateway -}}
{{- $keycloak := .Values.keycloak -}}
{{/*
  Two-listener auth pattern (RHCL 1.4 docs, Register PDF Ch.4-5):

  1. AUTHN AuthPolicy → targets Gateway sectionName: mcp
     - Validates JWT on external traffic (the mcp-gateway-route)
     - Skips /.well-known paths (OAuth discovery)
     - Returns 401 with resource_metadata pointer on failure

  2. AUTHZ AuthPolicy → targets Gateway sectionName: mcps
     - Validates JWT again (each listener needs its own authn)
     - CEL authorization checks x-mcp-toolname / x-mcp-promptname headers
       (set by ext_proc DURING body processing — only visible on the mcps
       listener because per-server routes land here AFTER ext_proc routing)
     - Checks resource_access.<servername>.roles for tool:<name> / prompt:<name>
     - Returns 403 on insufficient permissions

  Per-server HTTPRoutes must reference sectionName: mcps (see httproute.yaml).
  The mcp and mcps listeners must both be on the same port so ext_proc's
  route-cache-clear + :authority change can reach mcps routes.
*/}}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-gateway-authn
  namespace: {{ $gw.gatewayNamespace }}
  labels:
    app.kubernetes.io/name: mcp-gateway-authn
    app.kubernetes.io/part-of: mcp-servers
    app.kubernetes.io/component: auth
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gw.gatewayName }}
    sectionName: {{ $gw.sectionName }}
  defaults:
    when:
      - predicate: "!request.path.contains('/.well-known')"
    rules:
      authentication:
        keycloak:
          jwt:
            issuerUrl: {{ $keycloak.issuer | quote }}
      response:
        unauthenticated:
          code: 401
          headers:
            "WWW-Authenticate":
              {{- if $gw.publicHost }}
              value: "Bearer resource_metadata=https://{{ $gw.publicHost }}/.well-known/oauth-protected-resource"
              {{- else }}
              value: "Bearer"
              {{- end }}
          body:
            value: |
              {"error": "Unauthorized", "message": "Authentication required."}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-gateway-authz
  namespace: {{ $gw.gatewayNamespace }}
  labels:
    app.kubernetes.io/name: mcp-gateway-authz
    app.kubernetes.io/part-of: mcp-servers
    app.kubernetes.io/component: auth
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gw.gatewayName }}
    sectionName: {{ $gw.auth.authzSectionName }}
  rules:
    authentication:
      sso-server:
        jwt:
          issuerUrl: {{ $keycloak.issuer | quote }}
    {{- if $gw.auth.tokenExchange.enabled }}
    {{- $tex := $gw.auth.tokenExchange }}
    metadata:
      # RFC 8693 token exchange, adapted from Red Hat's own MCP Gateway
      # recipe (developers.redhat.com/articles/2025/12/12/advanced-
      # authentication-authorization-mcp-gateway) to this repo's
      # x-mcp-servername ("<namespace>/<name>") convention instead of
      # their request.host-keyed one — x-mcp-servername already matches
      # our Keycloak client IDs exactly, so no new client naming needed.
      # Confirmed live on sandbox268 (standalone curl against Keycloak,
      # not yet through this exact AuthPolicy path — the CEL expressions
      # below are adapted, not themselves live-verified; check Authorino's
      # logs on the first real request before trusting this silently):
      #   - grant_type=urn:ietf:params:oauth:grant-type:token-exchange
      #     with subject_token/audience as below returns an access_token
      #     whose aud/resource_access are narrowed to just that audience,
      #     PROVIDED the target realm has Keycloak V2 Standard Token
      #     Exchange set up (not V1 — V1 needs no code change here but
      #     doesn't narrow anything without also disabling
      #     fullScopeAllowed per-target, which is fragile and unnecessary
      #     with V2). See docs/token-exchange-design.md.
      oauth-token-exchange:
        when:
          - predicate: "request.headers.exists(h, h == 'x-mcp-servername')"
        cache:
          key:
            expression: "auth.identity.sub + ':' + request.headers['x-mcp-servername']"
          ttl: {{ $tex.cacheTtlSeconds }}
        http:
          url: "{{ $keycloak.issuer }}/protocol/openid-connect/token"
          method: POST
          credentials:
            # Confirmed via the installed AuthPolicy CRD's own field
            # description ("client credentials passed in the HTTP
            # Authorization header and the 'Bearer' prefix expected
            # PREPENDED TO THE SECRET VALUE" verbatim, no encoding done by
            # Authorino): the referenced secret's value is sent as-is with
            # "<prefix> " prepended. For real HTTP Basic auth this means
            # the secret must hold base64("clientId:clientSecret")
            # already computed — NOT the raw colon-joined string.
            authorizationHeader:
              prefix: Basic
          # sharedSecretRef is a SIBLING of credentials under http, not
          # nested inside it -- confirmed live: nesting it under
          # credentials (as in a first draft here) was rejected outright
          # by the installed AuthPolicy CRD's schema validation on `helm
          # upgrade` ("field not declared in schema").
          sharedSecretRef:
            name: {{ $tex.credentialSecretName }}
            key: {{ $tex.credentialSecretKey }}
          bodyParameters:
            grant_type:
              value: urn:ietf:params:oauth:grant-type:token-exchange
            subject_token:
              expression: "request.headers['authorization'].split('Bearer ')[1]"
            subject_token_type:
              value: urn:ietf:params:oauth:token-type:access_token
            audience:
              expression: "request.headers['x-mcp-servername']"
    {{- end }}
    authorization:
      tool-access-check:
        when:
          - predicate: "request.headers.exists(h, h == 'x-mcp-toolname')"
        patternMatching:
          patterns:
            - predicate: |
                ('tool:' + request.headers['x-mcp-toolname']) in
                (has(auth.identity.resource_access) &&
                 auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername'])
                 ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles : [])
      prompt-access-check:
        when:
          - predicate: "request.headers.exists(h, h == 'x-mcp-promptname')"
        patternMatching:
          patterns:
            - predicate: |
                ('prompt:' + request.headers['x-mcp-promptname']) in
                (has(auth.identity.resource_access) &&
                 auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername'])
                 ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles : [])
    response:
      {{- if $gw.auth.tokenExchange.enabled }}
      success:
        headers:
          # Forward the exchanged (narrowly-scoped) token if the exchange
          # above actually ran and produced one; otherwise fail OPEN to
          # the original Authorization header unchanged, same as today —
          # a missed/failed exchange (e.g. no x-mcp-servername on this
          # request, or Keycloak unreachable) degrades to current
          # pass-through behavior rather than breaking the request. This
          # is a deliberate availability-over-strictness choice for a
          # defense-in-depth control, not the primary authz gate (that's
          # still tool-access-check/prompt-access-check above, evaluated
          # against the ORIGINAL token either way) — revisit if stricter
          # fail-closed behavior is wanted instead.
          authorization:
            plain:
              # has() only accepts a field-selector chain (a.b.c), not map
              # index access (a['b']) -- confirmed live: this rule failed
              # every AuthConfig reconciliation with "invalid argument to
              # has() macro" until switched to the `in` operator below,
              # which is the correct way to test map-key existence in CEL.
              expression: >-
                ('oauth-token-exchange' in auth.metadata &&
                 'access_token' in auth.metadata['oauth-token-exchange'])
                  ? 'Bearer ' + auth.metadata['oauth-token-exchange'].access_token
                  : request.headers['authorization']
      {{- end }}
      unauthenticated:
        headers:
          "WWW-Authenticate":
            value: "Bearer"
        body:
          value: |
            {"error": "Unauthorized", "message": "MCP Access denied: Authentication required."}
      unauthorized:
        body:
          value: |
            {"error": "Forbidden", "message": "MCP Access denied: Insufficient permissions."}
{{- end }}
