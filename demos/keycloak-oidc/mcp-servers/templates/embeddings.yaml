{{- if .Values.embeddings.enabled }}
{{- $e := .Values.embeddings -}}
# Shared embeddings backend for mcp-market-news and mcp-kyc-compliance:
# jinaai/jina-embeddings-v3 served via vLLM CPU inference behind a KServe
# InferenceService, in RawDeployment mode (plain Deployment + Service under
# the hood, no Knative/Serverless requirement). Both servers call its
# OpenAI-compatible POST /v1/embeddings instead of embedding a model
# in-process with candle/hf-hub — one model download, one running copy,
# instead of one per Rust binary. Requires the RHOAI (Red Hat OpenShift AI)
# operator with KServe/ModelServing enabled — see this demo's README
# "Prerequisites". Deliberately deviates from the reference deployment this
# was modeled on (alpha-hack-program/llama-stack-demo's jina-embeddings-v3-cpu
# model entry):
#   - No external Route: this InferenceService is called ONLY by the
#     mcp-server Deployments inside this same namespace (see
#     templates/deployment.yaml's `needsEmbeddings` support and the
#     EMBEDDINGS_BASE_URL it injects), so there's nothing to expose outside
#     the cluster. Matches this chart's existing habit of keeping app ports
#     loopback-only behind Envoy — no reason to open a second front door.
#   - No OCI-connection Secret (the reference's modelcar-connections.yaml
#     pattern): that Secret only exists so the image shows up nicely in the
#     OpenShift AI dashboard's "Connections" UI. Functionally unnecessary —
#     `storageUri: oci://...` on the InferenceService's predictor.model
#     works standalone without it.
#   - minReplicas/maxReplicas both 1, no autoscaling — a demo doesn't need it.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ $e.name }}
  annotations:
    # [VERIFY] "default-cpu" is the hardware profile name used by the
    # llama-stack-demo reference this was modeled on. RHOAI ships hardware
    # profiles per-cluster (in redhat-ods-applications by convention) and
    # the exact set/names available depend on how RHOAI was installed —
    # this was NOT confirmed against a live cluster. Check
    # `oc get hardwareprofiles -n redhat-ods-applications` and adjust
    # embeddings.hardwareProfile in values.yaml if "default-cpu" isn't
    # present.
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/apiProtocol: REST
    opendatahub.io/kserve-runtime: vllm
    openshift.io/display-name: "{{ $e.name }}"
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/name: {{ $e.name }}
    app.kubernetes.io/part-of: mcp-servers
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  containers:
    - name: kserve-container
      image: "{{ $e.runtimeImage }}"
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        # Literal KServe/vLLM Go-template placeholder, NOT a Helm variable —
        # escaped so Helm passes it through untouched. KServe substitutes it
        # with this InferenceService's own metadata.name at render time, so
        # the served model name always matches embeddings.name below.
        - --served-model-name={{ "{{.Name}}" }}
        - --max-model-len
        - "{{ $e.maxModelLen }}"
        - --distributed-executor-backend=mp
        # Always required here (unlike the reference, which gates this on
        # .embeddingsModel) — this ServingRuntime only ever serves an
        # embeddings model.
        - --trust-remote-code
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: VLLM_CACHE_ROOT
          value: /tmp
        - name: VLLM_SKIP_WARMUP
          value: "true"
        - name: HF_HUB_OFFLINE
          value: "0"
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
      readinessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      resources:
        {{- toYaml $e.resources | nindent 8 }}
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ $e.name }}
  annotations:
    opendatahub.io/model-type: generative
    serving.kserve.io/deploymentMode: RawDeployment
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/hardware-profile-name: {{ $e.hardwareProfile | quote }}
  labels:
    networking.kserve.io/visibility: cluster-local
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/name: {{ $e.name }}
    app.kubernetes.io/part-of: mcp-servers
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    deploymentStrategy:
      type: RollingUpdate
    model:
      modelFormat:
        name: vLLM
      name: ""
      runtime: {{ $e.name }}
      # ModelCar: model weights ship as an OCI image, pulled directly by
      # KServe's storage-initializer — no separate Secret/connection needed
      # (see the top-of-file comment on why the reference's
      # modelcar-connections.yaml Secret was skipped).
      storageUri: "oci://{{ $e.image }}"
      resources:
        {{- toYaml $e.resources | nindent 8 }}
{{- end }}
