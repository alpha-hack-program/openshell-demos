apiVersion: v2
name: mcp-servers
description: >-
  Keycloak-role-gated MCP servers for the keycloak-oidc demo. Each
  server validates the caller's Keycloak-issued OAuth access token directly
  (no SPIRE/SPIFFE dependency). This chart, and the JWT validation contract
  it assumes each server image implements, is this demo's own design — not
  provided by upstream OpenShell or NVIDIA. [VERIFY] before trusting it.
