apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: garak-envoy
  labels:
    app.kubernetes.io/name: garak-envoy
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    name: garak-envoy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
