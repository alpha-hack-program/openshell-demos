image:
  repository: docker.io/envoyproxy/envoy
  tag: "v1.31-latest"   # [VERIFY] pin an exact patch version before real use

# The OpenShell gateway's in-cluster address. Defaults to
# openshell.<release-namespace>.svc.cluster.local:8080 (the gateway's own
# port — same one the external Route forwards to). Override gateway.host if
# the gateway lives in a different namespace than this chart is installed
# into.
gateway:
  host: ""   # empty = openshell.<release-namespace>.svc.cluster.local
  port: 8080

# Envoy's TLS connection to the gateway skips chain validation — same
# reason every curl call in this demo uses -k (the gateway's cert isn't in
# Envoy's default trust store). Fine for evaluation, never for production.
insecureSkipVerifyGateway: true

route:
  # Leave empty to let OpenShift generate <name>-<namespace>.<apps-domain>
  host: ""
