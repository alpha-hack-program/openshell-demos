{{- if .Values.gateway.publicHost }}
# Without this Route nothing outside the Gateway API data plane can reach
# gateway.publicHost: the ClusterIP override in configmap.yaml deliberately
# keeps the gateway Service off a LoadBalancer, so the only way in is the
# OpenShift router. A sandbox resolving mcp.<apps-domain> otherwise lands on
# haproxy with no backend and gets a bare HTTP/1.0 503 — confirmed live, and
# easy to misread as the Gateway/HTTPRoute being broken when both are in fact
# Ready with routes attached.
#
# targetPort is the `mcp` listener by name, not a number: both listeners share
# gateway.port, so only the name disambiguates the external entry point from
# the internal post-routing `mcps` one.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/part-of: mcp-gateway
spec:
  host: {{ .Values.gateway.publicHost | quote }}
  port:
    targetPort: mcp
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: {{ .Values.gateway.name }}-{{ .Values.gateway.className }}
    weight: 100
  wildcardPolicy: None
{{- end }}
