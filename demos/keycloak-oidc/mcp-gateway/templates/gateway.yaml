apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/part-of: mcp-gateway
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ .Values.gateway.name }}-override-config
  listeners:
    - name: mcp
      hostname: {{ required "gateway.publicHost is required, e.g. mcp.apps.<cluster-domain>" .Values.gateway.publicHost | quote }}
      port: {{ .Values.gateway.port }}
      protocol: HTTP
      allowedRoutes:
        {{- include "mcp-gateway.allowedRoutes" . | nindent 8 }}
    {{- if .Values.auth.enabled }}
    - name: mcps
      port: {{ .Values.gateway.port }}
      protocol: HTTP
      allowedRoutes:
        {{- include "mcp-gateway.allowedRoutes" . | nindent 8 }}
    {{- end }}
