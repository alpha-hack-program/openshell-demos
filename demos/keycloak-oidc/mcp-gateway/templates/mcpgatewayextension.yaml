apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: {{ .Values.extension.name }}
  namespace: {{ .Values.extension.namespace }}
  labels:
    app.kubernetes.io/part-of: mcp-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
    sectionName: mcp
  publicHost: {{ required "gateway.publicHost is required, e.g. mcp.apps.<cluster-domain>" .Values.gateway.publicHost | quote }}
  {{- if .Values.auth.enabled }}
  # bearerMethodsSupported/scopesSupported, privateHost,
  # backendPingIntervalSeconds and urlElicitation are all defaulted by the
  # MCPGatewayExtension CRD itself once created — confirmed live: none of
  # them need to be set here.
  oauthProtectedResource:
    authorizationServers:
      - {{ .Values.keycloak.issuer | quote }}
  {{- end }}
