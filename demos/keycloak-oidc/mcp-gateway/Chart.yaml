apiVersion: v2
name: mcp-gateway
description: >-
  Cluster-scoped RHCL (Kuadrant) MCP Gateway resources that
  ../mcp-servers attaches to via mcpGateway.enabled: the GatewayClass,
  Gateway, MCPGatewayExtension, the cross-namespace ReferenceGrant it
  needs, ClusterIP override ConfigMap, and (when auth.enabled) the
  Authorino-TLS EnvoyFilter workaround. Confirmed live against sandbox268
  and (0.2.0) sandbox341 — this chart reproduces what was previously
  hand-applied via oc patch/oc apply in scripts/20 and scripts/21.
type: application
version: 0.2.0
appVersion: "0.2.0"
