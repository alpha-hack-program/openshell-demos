name: CI demo-env

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['util/demo-env/**']
  pull_request:
    paths: ['util/demo-env/**']

defaults:
  run:
    working-directory: util/demo-env

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  build:
    needs: check
    # Built on both because this is a developer tool run on whatever
    # machine is driving the demo, and it reads Unix file modes directly.
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
