name: Release onboard CLI

on:
  push:
    tags: ['onboard-v*']

defaults:
  run:
    working-directory: util/onboard

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: onboard-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: onboard-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: util/onboard/target/${{ matrix.target }}/release/onboard

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mv artifacts/onboard-linux-x86_64/onboard onboard-linux-x86_64
          mv artifacts/onboard-macos-aarch64/onboard onboard-macos-aarch64
          chmod +x onboard-linux-x86_64 onboard-macos-aarch64
        working-directory: .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            onboard-linux-x86_64
            onboard-macos-aarch64
