name: Release mcp-kyc-compliance

on:
  push:
    tags: ['mcp-kyc-compliance-v*']

env:
  # Same quay.io org already used for this demo's other MCP images (see
  # demos/keycloak-oidc/mcp-servers/values.yaml) — keeps mcp-kyc-compliance
  # consumable the same way.
  REGISTRY: quay.io/atarazana
  IMAGE_NAME: mcp-kyc-compliance

defaults:
  run:
    working-directory: mcp/mcp-kyc-compliance

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check
      - run: make test

  # Builds both binaries (mcp_server, corpus_indexer) into the same image
  # (see Containerfile) and pushes it to quay.io/atarazana, same
  # registry/login pattern as this demo's other MCP servers. Requires the
  # REGISTRY_USER and REGISTRY_PASSWORD repo secrets to be set (Settings >
  # Secrets and variables > Actions).
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Derive image version from tag
        run: echo "IMAGE_VERSION=${GITHUB_REF_NAME#mcp-kyc-compliance-v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push mcp-kyc-compliance
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE_NAME:$IMAGE_VERSION" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            -f Containerfile .
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_VERSION"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
