name: Release mcp-portfolio

on:
  push:
    tags: ['mcp-portfolio-v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mcp-portfolio

defaults:
  run:
    working-directory: mcp/mcp-portfolio

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check
      - run: make test

  # Builds the mcp_server container image and pushes it to GHCR
  # (see mcp/mcp-portfolio/README.md).
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push mcp-portfolio
        run: |
          docker build \
            -t "$REGISTRY/${{ github.repository }}/$IMAGE_NAME:${{ github.ref_name }}" \
            -t "$REGISTRY/${{ github.repository }}/$IMAGE_NAME:latest" \
            -f Containerfile .
          docker push "$REGISTRY/${{ github.repository }}/$IMAGE_NAME:${{ github.ref_name }}"
          docker push "$REGISTRY/${{ github.repository }}/$IMAGE_NAME:latest"
