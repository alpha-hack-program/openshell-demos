name: Release session-auditor

on:
  push:
    tags: ['session-auditor-v*']

env:
  # quay.io/atarazana — the same registry every other image in this repo
  # publishes to (see the release-mcp-*.yml workflows). This was
  # previously ghcr.io, which nothing in this demo actually pulls from —
  # sandboxes created via CLAUDE_AUDIT_IMAGE/CODEX_AUDIT_IMAGE
  # (quay.io/atarazana/...) never saw images pushed there.
  REGISTRY: quay.io/atarazana

defaults:
  run:
    working-directory: util/session-auditor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v5
        with:
          name: session-auditor-linux-x86_64-musl
          path: util/session-auditor/target/x86_64-unknown-linux-musl/release/session-auditor

  # Bakes the musl binary into each agent's sandbox base image and pushes
  # to quay.io/atarazana. This is load-bearing, not a convenience: /usr/local/bin is
  # read_only under OpenShell's default filesystem_policy (Landlock), and
  # neither `sandbox exec` nor `sandbox upload` can write there once a
  # sandbox exists — baking the binary in here, before the sandbox is
  # created, is the only way to get a copy of it into a path nothing
  # inside a running sandbox can replace. See
  # demos/keycloak-oidc/docs/prometheus-scraping.md.
  #
  # Each image gets three tags: the exact tag of the *base* image it's
  # built from (extracted from the Containerfile's own FROM line, so a
  # base-image bump is visible rather than silently going stale), `latest`,
  # and this crate's own release tag (github.ref_name) for release history.
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: session-auditor-linux-x86_64-musl
          path: util/session-auditor/target/x86_64-unknown-linux-musl/release
      - run: chmod +x util/session-auditor/target/x86_64-unknown-linux-musl/release/session-auditor
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push claude-audit
        run: |
          cp util/session-auditor/target/x86_64-unknown-linux-musl/release/session-auditor \
            demos/keycloak-oidc/images/claude-audit/session-auditor
          BASE_TAG=$(grep '^FROM' demos/keycloak-oidc/images/claude-audit/Containerfile | sed 's/.*://')
          docker build \
            -t "$REGISTRY/claude-audit:$BASE_TAG" \
            -t "$REGISTRY/claude-audit:latest" \
            -t "$REGISTRY/claude-audit:${{ github.ref_name }}" \
            -f demos/keycloak-oidc/images/claude-audit/Containerfile \
            demos/keycloak-oidc/images/claude-audit/
          docker push "$REGISTRY/claude-audit:$BASE_TAG"
          docker push "$REGISTRY/claude-audit:latest"
          docker push "$REGISTRY/claude-audit:${{ github.ref_name }}"
      - name: Build and push codex-audit
        run: |
          cp util/session-auditor/target/x86_64-unknown-linux-musl/release/session-auditor \
            demos/keycloak-oidc/images/codex-audit/session-auditor
          BASE_TAG=$(grep '^FROM' demos/keycloak-oidc/images/codex-audit/Containerfile | sed 's/.*://')
          docker build \
            -t "$REGISTRY/codex-audit:$BASE_TAG" \
            -t "$REGISTRY/codex-audit:latest" \
            -t "$REGISTRY/codex-audit:${{ github.ref_name }}" \
            -f demos/keycloak-oidc/images/codex-audit/Containerfile \
            demos/keycloak-oidc/images/codex-audit/
          docker push "$REGISTRY/codex-audit:$BASE_TAG"
          docker push "$REGISTRY/codex-audit:latest"
          docker push "$REGISTRY/codex-audit:${{ github.ref_name }}"

  release:
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: session-auditor-linux-x86_64-musl
          path: .
      - run: |
          mv session-auditor session-auditor-linux-x86_64-musl
          chmod +x session-auditor-linux-x86_64-musl
      - uses: softprops/action-gh-release@v2
        with:
          files: session-auditor-linux-x86_64-musl
