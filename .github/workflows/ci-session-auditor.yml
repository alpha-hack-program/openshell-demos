name: CI session-auditor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['util/session-auditor/**']
  pull_request:
    paths: ['util/session-auditor/**']

defaults:
  run:
    working-directory: util/session-auditor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # musl, not the native target — this is the artifact actually
      # deployed into sandboxes (see util/session-auditor/README.md)
      - run: cargo build --release --target x86_64-unknown-linux-musl
