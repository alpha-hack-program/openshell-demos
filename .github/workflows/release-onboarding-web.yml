name: Release onboarding-web

on:
  push:
    tags: ['onboarding-web-v*']

env:
  # quay.io/atarazana — the same registry every other image in this repo
  # publishes to (see the release-mcp-*.yml workflows). This was
  # previously ghcr.io, which nothing in this demo actually pulls from.
  REGISTRY: quay.io/atarazana

defaults:
  run:
    working-directory: util/onboarding-web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check
      - run: cargo build --release

  # The Containerfile builds the binary itself in its own builder stage
  # (mirrors mcp/mcp-portfolio/Containerfile) — no pre-built artifact to
  # hand it, unlike agent-proxy's sandbox-image workflow. Pushes to
  # quay.io/atarazana, same registry + login pattern as every other image
  # in this repo (see release-mcp-*.yml) — requires the REGISTRY_USER/
  # REGISTRY_PASSWORD repo secrets.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push onboarding-web
        run: |
          docker build \
            -t "$REGISTRY/onboarding-web:${{ github.ref_name }}" \
            -t "$REGISTRY/onboarding-web:latest" \
            -f util/onboarding-web/Containerfile \
            util/onboarding-web/
          docker push "$REGISTRY/onboarding-web:${{ github.ref_name }}"
          docker push "$REGISTRY/onboarding-web:latest"

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cp target/release/onboarding-web onboarding-web-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: util/onboarding-web/onboarding-web-linux-x86_64
