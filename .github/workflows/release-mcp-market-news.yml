name: Release mcp-market-news

on:
  push:
    tags: ['mcp-market-news-v*']

env:
  # Same quay.io org already used for this demo's other MCP images (see
  # demos/keycloak-oidc/mcp-servers/values.yaml: elegibility-engine-mcp-rs,
  # compatibility-engine-mcp-rs) — keeps mcp-market-news consumable the same way.
  REGISTRY: quay.io/atarazana
  IMAGE_NAME: mcp-market-news

defaults:
  run:
    working-directory: mcp/mcp-market-news

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  # Builds the mcp_server container image and pushes it to quay.io/atarazana,
  # same registry + login pattern as elegibility-engine-mcp-rs's CI. Requires
  # the REGISTRY_USER and REGISTRY_PASSWORD repo secrets to be set
  # (Settings > Secrets and variables > Actions) — they are NOT configured
  # yet as of this workflow's creation.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - name: Derive image version from tag
        run: echo "IMAGE_VERSION=${GITHUB_REF_NAME#mcp-market-news-v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push mcp-market-news
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE_NAME:$IMAGE_VERSION" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            -f mcp/mcp-market-news/Containerfile \
            mcp/mcp-market-news
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_VERSION"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
