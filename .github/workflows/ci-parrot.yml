name: CI parrot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['util/parrot/**']
  pull_request:
    paths: ['util/parrot/**']

defaults:
  run:
    working-directory: util/parrot

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # parrot-gpui (gpui) needs X11/xkb dev headers to link on Linux.
      # macOS links only against system frameworks — Xcode, already on
      # macos-latest runners, provides the Metal shader compiler gpui's
      # build script shells out to.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo build --release --target ${{ matrix.target }} -p parrot-tui -p parrot-gpui
