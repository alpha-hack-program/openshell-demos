name: CI parrot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['util/parrot/**']
  pull_request:
    paths: ['util/parrot/**']

defaults:
  run:
    working-directory: util/parrot

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Only parrot-tui (the `parrot` bin) — parrot-gpui is a stub not
      # shipped yet, and needs system X11 dev headers on Linux to link.
      - run: cargo build --release --target ${{ matrix.target }} -p parrot-tui
