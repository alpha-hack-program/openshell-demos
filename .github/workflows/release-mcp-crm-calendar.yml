name: Release mcp-crm-calendar

on:
  push:
    tags: ['mcp-crm-calendar-v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mcp-crm-calendar

defaults:
  run:
    working-directory: mcp/mcp-crm-calendar

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push mcp-crm-calendar
        run: |
          docker build \
            -t "$REGISTRY/${{ github.repository }}/$IMAGE_NAME:${{ github.ref_name }}" \
            -t "$REGISTRY/${{ github.repository }}/$IMAGE_NAME:latest" \
            -f mcp/mcp-crm-calendar/Containerfile \
            mcp/mcp-crm-calendar
          docker push "$REGISTRY/${{ github.repository }}/$IMAGE_NAME:${{ github.ref_name }}"
          docker push "$REGISTRY/${{ github.repository }}/$IMAGE_NAME:latest"
