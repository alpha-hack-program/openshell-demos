name: Release parrot

on:
  push:
    tags: ['parrot-v*']

defaults:
  run:
    working-directory: util/parrot

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make check

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: parrot-linux-x86_64
            gpui-artifact: parrot-gpui-linux-x86_64
            tauri-artifact: parrot-tauri-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: parrot-macos-aarch64
            gpui-artifact: parrot-gpui-macos-aarch64
            tauri-artifact: parrot-tauri-macos-aarch64
          # Intel-Mac leg: parrot-tauri's whole reason for existing (see
          # util/parrot/parrot-tauri's doc comments) is gpui's x86_64-macOS
          # support never having been exercised here. Cross-compiled from
          # an Apple-Silicon runner, same as the aarch64 leg builds on it
          # natively — Xcode ships both SDKs.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: parrot-macos-x86_64
            gpui-artifact: parrot-gpui-macos-x86_64
            tauri-artifact: parrot-tauri-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # parrot-gpui (gpui) needs X11/xkb dev headers to link on Linux;
      # parrot-tauri needs webkit2gtk/appindicator/rsvg dev headers there
      # too. macOS links only against system frameworks — Xcode, already on
      # macos-latest runners, provides both the Metal shader compiler
      # gpui's build script shells out to and the WKWebView parrot-tauri
      # uses, for both architectures.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo build --release --target ${{ matrix.target }} -p parrot-tui -p parrot-gpui -p parrot-tauri
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: util/parrot/target/${{ matrix.target }}/release/parrot
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.gpui-artifact }}
          path: util/parrot/target/${{ matrix.target }}/release/parrot-gpui
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.tauri-artifact }}
          path: util/parrot/target/${{ matrix.target }}/release/parrot-tauri

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - run: |
          for name in \
            parrot-linux-x86_64 parrot-macos-aarch64 parrot-macos-x86_64 \
            parrot-gpui-linux-x86_64 parrot-gpui-macos-aarch64 parrot-gpui-macos-x86_64 \
            parrot-tauri-linux-x86_64 parrot-tauri-macos-aarch64 parrot-tauri-macos-x86_64
          do
            bin=$(echo "$name" | sed -E 's/-(linux|macos)-(x86_64|aarch64)$//')
            mv "artifacts/$name/$bin" "$name"
            chmod +x "$name"
          done
        working-directory: .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            parrot-linux-x86_64
            parrot-macos-aarch64
            parrot-macos-x86_64
            parrot-gpui-linux-x86_64
            parrot-gpui-macos-aarch64
            parrot-gpui-macos-x86_64
            parrot-tauri-linux-x86_64
            parrot-tauri-macos-aarch64
            parrot-tauri-macos-x86_64
