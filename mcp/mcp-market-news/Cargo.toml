[package]
name = "mcp-market-news"
version = "0.2.0"
edition = "2021"
description = "MCP server exposing public market-news retrieval, filtered by ticker/sector and semantic similarity"
license = "MIT"

[lib]
name = "mcp_market_news"
path = "src/lib.rs"

[[bin]]
name = "mcp_server"
path = "src/mcp_server.rs"

[[bin]]
name = "news_generator"
path = "src/bin/news_generator.rs"

[dependencies]
# --- MCP server ---
rmcp = { version = "1.7", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "auth",
] }
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "io-std",
    "signal",
    "fs",
    "time",
] }
axum = { version = "0.8", features = ["macros"] }
http = "1"
schemars = { version = "1.0" }

# --- Shared ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# --- Database (news_generator: read distinct ticker/sector from positions) ---
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }

# --- LLM (news_generator: Anthropic Messages API) ---
# rustls instead of the default native-tls/openssl backend, to avoid
# requiring a system OpenSSL install in minimal build environments (UBI9
# minimal container, sandboxes without libssl-dev, etc).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- Embeddings: HTTP client for the shared, in-namespace vLLM/KServe
# embeddings service (jinaai/jina-embeddings-v3 on CPU) — see
# src/common/embedder.rs. Retired candle-transformers/hf-hub/tokenizers
# dependencies (in-process model + local download) removed in favor of this
# — see README "What was verified" for that migration's history.

# --- Vector index ---
turbovec = "1.0.0"

[dev-dependencies]
tempfile = "3"
