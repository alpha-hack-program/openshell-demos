[package]
name = "mcp-crm-calendar"
version = "0.1.2"
edition = "2021"

[dependencies]
rmcp = { version = "1.8", features = [
    "server",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
axum = { version = "0.8" }
base64 = "0.22"
http = "1"

[[bin]]
name = "mcp_server"
path = "src/mcp_server.rs"
